name: CI Setup
description: Common setup for all jobs

inputs:
  xcode-version:
    required: true
    default: "16.1.0"
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}
